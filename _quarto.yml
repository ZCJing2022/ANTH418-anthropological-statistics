project:
  type: website
  output-dir: docs
  execute-dir: project

  render:
    - index.qmd
    - syllabus.qmd
    - lecture-notes/index.qmd
    - weeks/week02.qmd
    - weeks/week03.qmd
    - weeks/week04.qmd
    - assignments/index.qmd
