    - readings/index.qmd
    - resources/*.qmd


  resources:
    - .nojekyll

website:
  title: "ANTH418: Anthropological Statistics"

  navbar:
    background: light
    left:
      - href: index.qmd
        text: Home

      - href: syllabus.qmd
        text: Syllabus

      - href: lecture-notes/index.qmd
        text: Lecture Notes

      - text: Study Guides
        menu:
          - href: weeks/week02.qmd
            text: "Week 2 — R, RStudio & Quarto"

          - href: weeks/week03.qmd
            text: "Week 3 — Measurement & Research Design"

          - href: weeks/week04.qmd
            text: "Week 4 — Central Tendency & Dispersion"

      - href: assignments/index.qmd
        text: Assignments

      - href: readings/index.qmd
        text: Readings

      - href: resources/index.qmd
